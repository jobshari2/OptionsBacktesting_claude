# Steps every job of azure-pipelines.yml starts with: Node.js, the npm download cache and the dependencies.
parameters:
  - name: node
    type: string
    default: '22.x'

steps:
  - task: UseNode@1
    displayName: Install Node.js ${{ parameters.node }}
    inputs:
      version: ${{ parameters.node }}

  - task: Cache@2
    displayName: Cache npm downloads
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)

  - script: npm ci
    displayName: Install dependencies
