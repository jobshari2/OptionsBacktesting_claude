# Used when MobileApp/ is copied into a repository of its own (this folder is the repository root).
# GitHub: Settings › Pages › Source = "GitHub Actions". The app is then at https://<owner>.github.io/<repository>/
# (Inside OptionsBacktesting_claude GitHub ignores this file; use deploy/github-pages-from-this-repo.yml there.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/stamp.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
