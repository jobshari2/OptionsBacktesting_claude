<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nifty Options</title>
  <meta name="description" content="Nifty options on your phone: live chain, collars, payoff builder and paper positions, straight from Upstox.">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Nifty Options</h1>
    <span id="updated" class="updated"></span>
    <button id="status" class="chip" type="button">…</button>
    <button id="refresh" class="icon-btn" type="button" aria-label="Refresh now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>
  <div id="updateBar" class="update-bar" hidden>A new version is ready. <button id="updateBtn" class="btn small primary" type="button">Reload</button></div>
  <main id="view" class="content"></main>
  <nav class="tabbar" aria-label="Screens"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
