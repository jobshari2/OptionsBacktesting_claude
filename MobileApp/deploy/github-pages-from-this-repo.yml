# Publishes MobileApp/www to GitHub Pages from the OptionsBacktesting_claude repository.
# To use it: copy this file to .github/workflows/mobile-pages.yml at the repository root, then in GitHub:
# Settings › Pages › Build and deployment › Source = "GitHub Actions". The app is then at
#   https://<owner>.github.io/<repository>/
# It runs when anything under MobileApp/ changes on main, or by hand (Actions › Mobile app to GitHub Pages › Run).
name: Mobile app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['MobileApp/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Stamp the service worker (so phones pick up the new version)
        run: node tools/stamp.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: MobileApp/www
      - id: deployment
        uses: actions/deploy-pages@v4
