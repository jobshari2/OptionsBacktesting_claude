<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kite login link</title>
  <style>
    :root { --bg: #0e1117; --text: #e6edf3; --muted: #8b949e; --up: #3fb68b; --down: #f0716b; }
    @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --text: #24292f; --muted: #57606a; --up: #1a7f37; --down: #cf222e; } }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    p { margin: 0; color: var(--muted); }
    .ok { color: var(--up); }
    .err { color: var(--down); }
  </style>
</head>
<body>
  <!-- Opened by the "Send Kite login here" bookmarklet on kite.zerodha.com: receives the Kite web session (enctoken)
       by postMessage, only from that origin, and hands it to this app's server, which checks it with Kite. -->
  <h3>Kite → Nifty Options Lab</h3>
  <p id="msg">Waiting for kite.zerodha.com…</p>
  <script>
    const KITE = 'https://kite.zerodha.com';
    const msg = document.getElementById('msg');
    const show = (text, cls) => {
      msg.textContent = text;
      msg.className = cls || '';
    };
    let done = false;
    window.addEventListener('message', async (ev) => {
      if (ev.origin !== KITE || done || !ev.data || typeof ev.data !== 'object') return;
      done = true;
      show('Checking the login with Kite…');
      try {
        const res = await fetch('/api/kite/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'enctoken', enctoken: String(ev.data.enctoken || ''), userId: String(ev.data.userId || '') }),
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok || j.error) throw new Error(j.error || 'HTTP ' + res.status);
        show(`Logged in as ${j.kite.userId}${j.kite.userName ? ' (' + j.kite.userName + ')' : ''}. The Feeds screen streams Kite now; this window closes by itself.`, 'ok');
        setTimeout(() => window.close(), 2500);
      } catch (e) {
        show(e.message, 'err');
      }
    });
    if (window.opener) window.opener.postMessage('ready', KITE);
    else show('Open this from the "Send Kite login here" bookmark on kite.zerodha.com.', 'err');
  </script>
</body>
</html>
